<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NANO Updater</title>
<meta name="description" content="Update the firmware of your NANO Industries devices from the browser.">
<style>
  /* The look of our products' screens; see template.html for the rules the sizes follow. */
  @font-face { font-family: "NANO Screen"; src: url(fonts/nano-screen-18.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "NANO Screen"; font-weight: 700; src: url(fonts/nano-screen-18-bold.ttf) format("truetype"); font-display: block; }
  @font-face { font-family: "NANO Big"; src: url(fonts/nano-big.ttf) format("truetype"); font-display: block; }
  :root {
    --bg: #000; --bezel: #1c2127; --white: #e6e6e6; --gray: #b2b2b2; --dim: #878787; --line: #40404a;
    --accent: #afdcfa;
    --accent-rule: color-mix(in srgb, var(--accent) 56%, #000);
    --mono: "NANO Screen", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--white); }
  body { font: 18px/28px var(--mono); -webkit-font-smoothing: none; font-smooth: never; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  :focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .bar-top { display: flex; gap: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent-rule); text-transform: uppercase; }
  .bar-top .where { color: var(--dim); }
  .bar-top .what { font-weight: 700; }
  h1 { font: 40px/48px "NANO Big", var(--mono); color: var(--accent); margin: 28px 0 8px; text-transform: uppercase; }
  .lead { color: var(--gray); margin: 0 0 8px; }
  section { margin-top: 28px; border: 4px solid var(--bezel); border-radius: 14px; padding: 12px 16px; background: #000; }
  /* a group's name is a chip in its colour, like the effect names on the FX-DR2 */
  h2 { display: inline-block; margin: 0 0 8px; padding: 0 8px; background: var(--accent); color: #000;
    font: 700 18px/28px var(--mono); text-transform: uppercase; }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { border-top: 2px solid var(--line); }
  /* a product is a row: name, what it is, its firmware; picked, it inverts like a SETTINGS row */
  .product { display: flex; align-items: baseline; gap: 12px; padding: 8px; color: inherit; text-decoration: none; }
  .name { font-weight: 700; color: var(--accent); text-transform: uppercase; }
  .tag { color: var(--dim); text-transform: uppercase; }
  .meta { margin-left: auto; color: var(--gray); text-align: right; }
  .go { color: var(--accent); }
  a.product:hover, a.product:focus-visible { background: var(--accent); outline: none; }
  a.product:hover *, a.product:focus-visible * { color: #000; }
  .soon .name { color: var(--dim); }
  footer { margin-top: 36px; color: var(--dim); text-align: center; text-transform: uppercase; }
  @media (max-width: 520px) {
    h1 { font-size: 32px; line-height: 40px; }
    .product { flex-wrap: wrap; }
    .tag { flex-basis: 100%; order: 3; }
  }
</style>
</head>
<body>
<main>
  <div class="bar-top"><span class="where">NANO Industries</span><span class="what">Firmware</span></div>
  <h1>Updater</h1>
  <p class="lead">Pick your device to update its firmware from the browser, in Chrome or Edge.</p>
  <div id="list"></div>
  <footer>NANO Industries · Valencia, SPAIN</footer>
</main>
<script>
"use strict";
// The list comes from products.json, the same file every product page reads its settings from.
(async () => {
  const list = document.getElementById("list");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let cat;
  try { cat = await (await fetch("products.json", { cache: "no-store" })).json(); }
  catch (e) { list.textContent = "The product list could not be loaded."; return; }
  for (const g of cat.groups) {
    const sec = el("section");
    if (g.accent) sec.style.setProperty("--accent", g.accent);
    sec.appendChild(el("h2", "", g.name));
    const ul = el("ul");
    for (const slug of g.products) {
      const p = cat.products[slug]; if (!p) continue;
      const ready = p.bootloader && p.steps;
      const li = el("li");
      const card = el(ready ? "a" : "div", "product" + (ready ? "" : " soon"));
      if (ready) card.href = slug + "/";
      const what = el("span", "meta", ready ? "" : "Coming soon");
      card.append(el("span", "name", p.name));
      if (p.tagline) card.append(el("span", "tag", p.tagline));
      card.append(what);
      if (ready) {
        card.append(el("span", "go", "→"));
        fetch(slug + "/firmware.json", { cache: "no-store" })
          .then(r => (r.ok ? r.json() : null))
          .then(m => { what.textContent = !m ? "No firmware yet" : m.variants ? `${m.variants.length} models`
            : m.version ? `v${m.version}` : m.date; })
          .catch(() => {});
      }
      li.appendChild(card); ul.appendChild(li);
    }
    sec.appendChild(ul);
    list.appendChild(sec);
  }
})();
</script>
</body>
</html>
