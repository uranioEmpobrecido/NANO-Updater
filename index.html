<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NANO Updater</title>
<meta name="description" content="Update the firmware of your NANO Industries devices from the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap">
<style>
  /* The look of our products' screens, in JetBrains Mono; see template.html. */
  :root {
    --bg: #000; --bezel: #1c2127; --white: #e6e6e6; --gray: #b2b2b2; --dim: #878787; --line: #40404a;
    --accent: #afdcfa;
    --accent-rule: color-mix(in srgb, var(--accent) 56%, #000);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--white); }
  body { font: 16px/26px var(--mono); }   /* regular weight only: the brand's type */
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  :focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .bar-top { display: flex; gap: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent-rule); text-transform: uppercase;
    font-size: 14px; letter-spacing: .08em; }
  .bar-top .where { color: var(--dim); }
  .bar-top .what { color: var(--white); }
  h1 { font: 400 40px/48px var(--mono); color: var(--accent); margin: 28px 0 8px; text-transform: uppercase; }
  .lead { color: var(--gray); margin: 0 0 8px; }
  section { margin-top: 28px; border: 4px solid var(--bezel); border-radius: 14px; padding: 12px 16px; background: #000; }
  /* a group's name is a chip in its colour, like the effect names on the FX-DR2 */
  h2 { display: inline-block; margin: 0 0 8px; padding: 0 8px; background: var(--accent); color: #000;
    font: 400 15px/26px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { border-top: 2px solid var(--line); }
  /* a product is a row: name, its firmware, and what it is under them; picked, it inverts like a
     SETTINGS row */
  .product { display: grid; grid-template-columns: 1fr auto auto; column-gap: 12px; align-items: baseline;
    padding: 8px; color: inherit; text-decoration: none; }
  .name { color: var(--accent); text-transform: uppercase; letter-spacing: .02em; }
  .meta { color: var(--gray); text-align: right; font-size: 14px; }
  .desc { grid-column: 1 / -1; font-size: 13px; line-height: 20px; color: var(--dim); }
  .go { color: var(--accent); }
  a.product:hover, a.product:focus-visible { background: var(--accent); outline: none; }
  a.product:hover *, a.product:focus-visible * { color: #000; }
  .soon .name { color: var(--dim); }
  footer { margin-top: 36px; color: var(--dim); text-align: center; text-transform: uppercase; font-size: 13px; letter-spacing: .08em; }
  /* Tester mode's control, at the foot */
  .tester { margin-top: 10px; font-size: 13px; color: var(--dim); text-transform: none; letter-spacing: 0; }
  .tlink { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--dim);
    text-decoration: underline; cursor: pointer; }
  .tlink:hover { color: var(--white); }
  .tform { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tform input { font: 14px/22px var(--mono); background: #000; color: var(--white); border: 2px solid var(--line);
    padding: 2px 8px; width: 160px; }
  .tform button { font: 14px/22px var(--mono); background: var(--accent); color: #000; border: 0; padding: 2px 10px; cursor: pointer; }
  .tmsg { color: var(--err, #eb4238); }
  .badge { font-size: 11px; line-height: 16px; padding: 0 6px; margin-left: 10px; border: 1px solid currentColor;
    letter-spacing: .06em; vertical-align: middle; }

  @media (max-width: 520px) {
    h1 { font-size: 30px; line-height: 38px; }
  }
</style>
</head>
<body>
<main>
  <div class="bar-top"><span class="where">NANO Industries</span><span class="what">Firmware</span></div>
  <h1>Updater</h1>
  <p class="lead">Pick your device to update its firmware from the browser, in Chrome or Edge.</p>
  <div id="list"></div>
  <footer>NANO Industries · Valencia, SPAIN<div class="tester" id="tester"></div></footer>
</main>
<script>
"use strict";
// Tester mode. Products marked "unreleased" in products.json show only to testers: one enters the
// code once (TESTER, at the foot of the page) and this browser keeps its salted hash — never the
// code — and shows them from then on. It hides, it does not protect: the site is static and its
// repository public.
const TESTER_KEY = "nanoTester";
async function sha256hex(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
function testerOn(cat) {
  try { return !!cat.tester && localStorage.getItem(TESTER_KEY) === cat.tester.hash; } catch (e) { return false; }
}
async function testerUnlock(cat, code) {
  if (!cat.tester || !code.trim()) return false;
  const h = await sha256hex(cat.tester.salt + code.trim());
  if (h !== cat.tester.hash) return false;
  try { localStorage.setItem(TESTER_KEY, h); } catch (e) {}
  return true;
}
function testerLock() { try { localStorage.removeItem(TESTER_KEY); } catch (e) {} }
// The control at the foot: "Tester" opens a code field; in tester mode, "Tester mode · Exit".
function testerControl(box, cat, changed) {
  box.replaceChildren();
  if (!cat.tester) return;
  const link = (text, fn) => { const a = document.createElement("button"); a.type = "button"; a.className = "tlink"; a.textContent = text; a.onclick = fn; return a; };
  if (testerOn(cat)) {
    const s = document.createElement("span"); s.textContent = "Tester mode · ";
    box.append(s, link("Exit", () => { testerLock(); changed(); }));
    return;
  }
  box.append(link("Tester", () => {
    box.replaceChildren();
    const f = document.createElement("form"); f.className = "tform";
    const i = document.createElement("input"); i.type = "password"; i.autocomplete = "off"; i.placeholder = "Tester code";
    const b = document.createElement("button"); b.type = "submit"; b.textContent = "Enter";
    const m = document.createElement("span"); m.className = "tmsg";
    f.append(i, b, m);
    f.onsubmit = async ev => {
      ev.preventDefault();
      if (await testerUnlock(cat, i.value)) changed();
      else { m.textContent = "Wrong code"; i.select(); }
    };
    box.append(f); i.focus();
  }));
}

// The list comes from products.json, the same file every product page reads its settings from.
(async () => {
  const list = document.getElementById("list");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let cat;
  try { cat = await (await fetch("products.json", { cache: "no-store" })).json(); }
  catch (e) { list.textContent = "The product list could not be loaded."; return; }
  const render = () => {
  list.replaceChildren();
  const tester = testerOn(cat);
  testerControl(document.getElementById("tester"), cat, render);
  for (const g of cat.groups) {
    // Unreleased products only in tester mode; a group with nothing to show is not shown.
    const shown = g.products.filter(slug => cat.products[slug] && (tester || !cat.products[slug].unreleased));
    if (!shown.length) continue;
    const sec = el("section");
    if (g.accent) sec.style.setProperty("--accent", g.accent);
    sec.appendChild(el("h2", "", g.name));
    const ul = el("ul");
    for (const slug of shown) {
      const p = cat.products[slug];
      const ready = p.bootloader && p.steps;
      const li = el("li");
      const card = el(ready ? "a" : "div", "product" + (ready ? "" : " soon"));
      if (ready) card.href = slug + "/";
      const what = el("span", "meta", ready ? "" : "Coming soon");
      const name = el("span", "name", p.name);
      if (p.unreleased) name.append(el("span", "badge", "Unreleased"));
      card.append(name, what, el("span", "go", ready ? "→" : ""));
      if (p.description) card.append(el("span", "desc", p.description));
      if (ready) {
        fetch(slug + "/firmware.json", { cache: "no-store" })
          .then(r => (r.ok ? r.json() : null))
          .then(m => {
            const date = m && (m.date || (m.built || "").slice(0, 10));
            what.textContent = !m ? "No firmware yet" : m.variants ? `${m.variants.length} models`
              : date || (m.version ? `v${m.version}` : "");
          })
          .catch(() => {});
      }
      li.appendChild(card); ul.appendChild(li);
    }
    sec.appendChild(ul);
    list.appendChild(sec);
  }
  };
  render();
})();
</script>
</body>
</html>
